name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libarchive-dev libcurl4-openssl-dev ninja-build \
            libdbus-1-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libcairo2-dev libpango1.0-dev libdecor-0-dev \
            libx11-dev libxext-dev libxft-dev libxinerama-dev \
            libxcursor-dev libxrender-dev libxfixes-dev

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install dependencies
        shell: pwsh
        run: >-
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install
          curl:x64-windows
          libarchive:x64-windows

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Smoke test desktop interface
        shell: pwsh
        run: |
          $gui = (Resolve-Path 'build/Release/vibescriber-gui.exe').Path
          $process = Start-Process -FilePath $gui -PassThru
          try {
            Start-Sleep -Seconds 3
            if ($process.HasExited) {
              throw "GUI exited during startup with code $($process.ExitCode)"
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
